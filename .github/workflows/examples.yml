name: Validate examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python examples
        run: |
          python -m py_compile python/*.py
          find marketplaces -name '*.py' -print0 | xargs -0 python -m py_compile
      - name: Check Node.js examples
        run: |
          for file in node/*.mjs; do node --check "$file"; done
          find marketplaces -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Type-check TypeScript examples
        run: npx --yes --package typescript@5.9.3 tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext typescript/*.ts
      - name: Check shell example
        run: bash -n curl/examples.sh
