name: Validate examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python examples
        run: python -m py_compile python/*.py
      - name: Check Node.js examples
        run: |
          for file in node/*.mjs; do node --check "$file"; done
      - name: Check shell example
        run: bash -n curl/examples.sh
